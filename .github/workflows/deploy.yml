name: Deploy to InfinityFree

on:
  push:
    branches:
      - dev-vipin  # Aapki main branch ko push hone par yeh trigger hoga

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          ftp-server: ftp://gym-saas-backend.infinityfreeapp.com/
          ftp-username: ${{secrets.FTP_USERNAME}}
          ftp-password: ${{secrets.FTP_PASSWORD}}
          local-dir: ./ # Local repository ki root directory se files upload karenge
          remote-dir: /htdocs  # Files ko public_html folder mein upload karna hai
